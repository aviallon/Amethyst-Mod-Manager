name: Lint

on:
  push:
    branches: [main, "viallon/**"]
  pull_request:

jobs:
  lint:
    name: ruff + mypy + theme-keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install linters
        run: pip install ruff mypy
      - name: Theme-key static lint (AST)
        run: python3 src/gui_qt/_theme_keys_lint.py
      - name: ruff
        run: ruff check src/
      - name: mypy
        run: mypy src/

  theme-selftests:
    name: theme selftests (offscreen render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Qt bindings + system GL/EGL libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
          pip install PySide6
      - name: Run the four theme suites
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for t in _theme_state_colors_selftest _theme_live_switch_selftest \
                   _theme_platform_render_selftest _theme_system_selftest; do
            echo "== $t"
            python3 "src/gui_qt/$t.py"
          done

  selftests:
    name: bethesda / vfs-mask / wizard self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Qt bindings + system GL/EGL libs + bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 bubblewrap
          pip install PySide6
      - name: Bethesda self-tests (xEdit/QAC, output-mod swap, modlist)
        env:
          PYTHONPATH: src
        run: python3 -m Utils.bethesda._selftest
      # The fork's own contract tests. `Utils/fs/clone.py` is UPSTREAM's file,
      # so an upstream edit can regress the fork's clone contract (symlinks
      # never followed, xattrs never copied, errors never swallowed) with a
      # fully green pipeline unless these run here.
      - name: Fork contract self-tests (clone, bundled meta.ini, filegraph)
        env:
          PYTHONPATH: src
        run: |
          python3 -m Utils.profiles._selftest
          python3 -m Nexus._bundled_meta_selftest
          python3 -m Utils.filegraph._selftest
      - name: VFS mask self-tests (explicit selection)
        # The FULL Utils.vfs._selftest suite is not runnable here: beyond the
        # mask tests it needs native/runtime deps this job does not install
        # (lz4, the filegraph native bits), so its non-mask checks fail on
        # missing dependencies (some also assume /bin/true, which NixOS dev
        # hosts lack). Those pre-existing failures are deliberately not
        # "fixed" here - CI runs the mask-relevant subset deterministically
        # by name instead.
        env:
          PYTHONPATH: src
        run: |
          python3 src/Utils/vfs/_selftest.py \
            test_wrap_command_mask_paths \
            test_mask_case_variant_canonicalization \
            test_srt_bwrap_mask_insertion \
            test_reject_masks_when_direct_routes \
            test_wrap_tool_command_masks_fail_loud_without_vfs \
            test_launch_mask_threading
      - name: DynDOLOD wizard self-tests (offscreen Qt)
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: python3 src/wizards_qt/_dyndolod_selftest.py
