name: Flatpak (viallon channel)

# Internal release tags only:  v<upstream-version>[-<prerelease>]-viallon<N>[.<M>]
#
#   v2.4.3-viallon1           -> stable   (a stable publish also lands on beta)
#   v2.5.0-beta.6-viallon1    -> beta
#   v2.5.0-rc1-viallon2       -> beta
#   v2.5.0-viallon12.3        -> stable   (automatic runtime rebuild, M bumps)
#
# N is the human release counter; the optional .M counter is bumped only by the
# scheduled runtime-drift rebuild, never by hand.
#
# The daily schedule compares the Flathub commits of the PySide BaseApp and the
# KDE runtime with the ones the last successful build used
# (.github/flatpak-runtime-pins.json). On drift it rebuilds the newest *stable*
# release tag against the new base/runtime and republishes it to stable under
# `viallon<N>.<M+1>`. Use the manual "simulate_schedule" dispatch input to run
# that exact path on demand.
#
# NOTE: upstream classifies with `[[ "$ref" == v*-* ]] -> beta`, which would
# mis-file `v2.4.3-viallon1` as beta. The classifier below strips the
# `-viallonN[.M]` suffix FIRST and only then looks for a remaining prerelease.
#
# The build runs here; publishing is delegated to the reusable workflow in
# aviallon/hub-viallon, which merges the result into the accumulated OSTree repo
# served from that repository's Pages branch.

on:
  push:
    tags:
      - 'v*-viallon*'
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to build.
        required: true
        default: viallon/release
      channel:
        description: OSTree channel to publish to.
        type: choice
        options:
          - stable
          - beta
        default: beta
      dry_run:
        description: Publish to the dry-run Pages branch instead of the live one.
        type: boolean
        default: true
      simulate_schedule:
        description: Run the runtime-drift path (as if triggered by the daily schedule).
        type: boolean
        default: false

# Least privilege: only `finalize` needs to write (pins commit + tag).
permissions:
  contents: read

jobs:
  meta:
    name: Resolve channel
    runs-on: ubuntu-latest
    outputs:
      ostree: ${{ steps.c.outputs.ostree }}
      subject: ${{ steps.c.outputs.subject }}
      prerelease: ${{ steps.c.outputs.prerelease }}
      dry: ${{ steps.c.outputs.dry }}
      rebuild: ${{ steps.c.outputs.rebuild }}
      tag: ${{ steps.c.outputs.tag }}
      build_ref: ${{ steps.c.outputs.build_ref }}
      build_sha: ${{ steps.c.outputs.build_sha }}
      base_commit: ${{ steps.pins.outputs.base }}
      runtime_commit: ${{ steps.pins.outputs.runtime }}
    steps:
      # Checkout the default branch: this job only needs the tag list and the
      # pins file, both of which live there (fetch-depth 0 also fetches tags).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve Flathub base/runtime commits
        id: pins
        # A tag release does not depend on the pins: an apt/flathub hiccup must
        # not block it. The drift path re-checks the values and fails loud.
        continue-on-error: ${{ github.event_name != 'schedule' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak
          flatpak --user remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          base=$(flatpak remote-info --user --show-commit flathub io.qt.PySide.BaseApp//6.11)
          rt=$(flatpak remote-info --user --show-commit flathub org.kde.Platform//6.11)
          echo "PySide BaseApp//6.11 = $base"
          echo "KDE runtime//6.11    = $rt"
          echo "base=$base"    >> "$GITHUB_OUTPUT"
          echo "runtime=$rt" >> "$GITHUB_OUTPUT"

      - name: Classify the event / detect drift
        id: c
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_REF: ${{ inputs.ref }}
          IN_CHANNEL: ${{ inputs.channel }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_SIMULATE: ${{ inputs.simulate_schedule }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE: ${{ steps.pins.outputs.base }}
          RUNTIME: ${{ steps.pins.outputs.runtime }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          # ---- runtime-drift rebuild (daily schedule, or the simulate input) ----
          if [ "$EVENT" = "schedule" ] || [ "$IN_SIMULATE" = "true" ]; then
            if [ -z "$BASE" ] || [ -z "$RUNTIME" ]; then
              echo "::error::could not resolve the Flathub base/runtime commits"
              exit 1
            fi
            pins=".github/flatpak-runtime-pins.json"
            pb=$(jq -r '.base // ""' "$pins" 2>/dev/null || echo "")
            pr=$(jq -r '.runtime // ""' "$pins" 2>/dev/null || echo "")
            if [ "$pb" = "$BASE" ] && [ "$pr" = "$RUNTIME" ]; then
              echo "No runtime drift; nothing to rebuild." | tee -a "$GITHUB_STEP_SUMMARY"
              out rebuild false; out tag ""; out ostree stable; out subject ""
              out prerelease false; out dry false
              out build_ref "refs/heads/$DEFAULT_BRANCH"; out build_sha ""
              exit 0
            fi

            # Newest STABLE tag only: a prerelease must not divert the runtime
            # fix away from the stable channel.
            # `|| true`: under `set -euo pipefail` a non-matching grep would abort
            # the step before the explicit "no stable tag" error below.
            latest=$(git for-each-ref --sort=-v:refname --format='%(refname:short)' \
                       'refs/tags/v*-viallon*' \
                     | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-viallon[0-9]+(\.[0-9]+)?$' \
                     | head -1 || true)
            if [ -z "$latest" ]; then
              echo "::error::no stable v<X.Y.Z>-viallon<N>[.M] tag found"
              exit 1
            fi
            base_v="${latest%-viallon*}"
            vers="${latest##*-viallon}"
            n="${vers%%.*}"
            m="${vers#*.}"; [ "$m" = "$vers" ] && m=0
            m=$((m + 1))
            next="v${base_v#v}-viallon${n}.${m}"
            subj="${base_v#v}+viallon${n}.${m}"

            {
              echo "### Runtime drift rebuild"
              echo
              echo "| field | value |"
              echo "|---|---|"
              echo "| rebuilt from | \`$latest\` |"
              echo "| new tag | \`$next\` |"
              echo "| channel | **stable** |"
              echo "| BaseApp commit | \`$BASE\` |"
              echo "| runtime commit | \`$RUNTIME\` |"
            } >> "$GITHUB_STEP_SUMMARY"

            out rebuild true; out tag "$next"; out ostree stable; out subject "$subj"
            out prerelease false; out dry "${IN_DRY:-false}"
            out build_ref "refs/tags/$latest"; out build_sha "$(git rev-parse "refs/tags/$latest^{commit}")"
            exit 0
          fi

          # ---- workflow_dispatch ----
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # A manual publish IS a prerelease when it targets the beta channel:
            # that is what the channel means, and the GitHub release must say so.
            pre=false; [ "$IN_CHANNEL" = "beta" ] && pre=true
            out rebuild true; out tag ""; out ostree "$IN_CHANNEL"; out subject "$REF_NAME"
            out prerelease "$pre"; out dry "$IN_DRY"; out build_ref "$IN_REF"; out build_sha ""
            exit 0
          fi

          # ---- tag push ----
          tag="$REF_NAME"
          if [[ "$tag" != *-viallon* ]]; then
            echo "::error::tag '$tag' must end in -viallon<N>, -viallon<N>.<M> or -viallon<N><letters>"
            exit 1
          fi
          n="${tag##*-viallon}"
          # Three grammars, on purpose:
          #   N           a release of the base version            (v2.5.2-viallon13)
          #   N.M         the drift rebuild's own tag              (skipped below)
          #   N<letters>  a PRERELEASE: the fork resets the counter at every
          #               rebase (viallon0a) and marks it with letters.
          if [[ ! "$n" =~ ^[0-9]+(\.[0-9]+)?$ ]] \
             && [[ ! "$n" =~ ^[0-9]+[a-z]+$ ]]; then
            echo "::error::viallon counter must be N, N.M or N<letters> (e.g. 13, 12.1, 0a), got '$n' in '$tag'"
            exit 1
          fi
          base="${tag%-viallon*}"
          if   [[ "$base" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            base_ch=stable
          elif [[ "$base" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+$ ]]; then
            base_ch=beta
          else
            echo "::error::unrecognised base version '$base' (from '$tag')"
            exit 1
          fi
          # A letter suffix means PRERELEASE, and a prerelease goes to the beta
          # channel whatever the base version says: that is the only way a tester
          # can pick it up without touching the stable branch.
          if [[ "$n" =~ [a-z] ]]; then
            pre=true; ch=beta
          else
            pre=false; ch="$base_ch"
          fi

          # An `N.M` tag is created by the drift rebuild itself, whose run has
          # already built and published this version. A PAT (unlike
          # GITHUB_TOKEN) does start a run when `finalize` pushes that tag, so
          # skip it here to avoid a duplicate build+publish (release.yml and
          # push-source-to-resources.yml carry the same guard).
          if [[ "$n" == *.* ]]; then
            echo "Tag \`$tag\` is an automatic rebuild tag; already built by the drift run. Nothing to do."
            out rebuild false; out tag ""; out ostree "$ch"; out subject ""
            out prerelease false; out dry false
            out build_ref "refs/heads/$DEFAULT_BRANCH"; out build_sha ""
            exit 0
          fi

          {
            echo "### Flatpak publish"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| tag | \`$tag\` |"
            echo "| base version | \`$base\` |"
            echo "| viallon release | \`$n\` |"
            echo "| channel | **$ch** |"
            echo "| prerelease | **$pre** |"
            echo "| commit subject | \`${base#v}+viallon${n}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          out rebuild true; out tag ""; out ostree "$ch"; out subject "${base#v}+viallon${n}"
          out prerelease "$pre"; out dry false; out build_ref "$REF"; out build_sha "$SHA"

  filegraph:
    name: Build filegraph extension
    needs: meta
    if: needs.meta.outputs.rebuild == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.build_ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: native/amethyst_filegraph/target/release
          key: filegraph-release-v1-${{ runner.os }}-${{ hashFiles('native/amethyst_filegraph/Cargo.lock') }}
          restore-keys: filegraph-release-v1-${{ runner.os }}-

      # meson's src/meson.build installs src/amethyst_filegraph.abi3.so and
      # fails outright if it is absent, so it must exist before flatpak-builder
      # runs. Upstream does exactly this in its own filegraph-native job.
      - name: Build the extension into src/
        run: |
          set -euo pipefail
          cargo build --locked --release \
            --manifest-path native/amethyst_filegraph/Cargo.toml
          cp native/amethyst_filegraph/target/release/libamethyst_filegraph.so \
             src/amethyst_filegraph.abi3.so

      - uses: actions/upload-artifact@v4
        with:
          name: filegraph-native
          path: src/amethyst_filegraph.abi3.so
          if-no-files-found: error

  flatpak:
    name: Build Flatpak (${{ needs.meta.outputs.ostree }})
    needs: [meta, filegraph]
    if: needs.meta.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      # flatpak-builder sandboxes every module build with bwrap, which needs to
      # create a user namespace. An unprivileged container cannot, and each
      # module then dies with:
      #   bwrap: No permissions to create a new namespace, likely because the
      #   kernel does not allow non-privileged user namespaces.
      # Upstream's own container jobs pass --privileged for the same reason.
      options: --privileged
    steps:
      # No persisted credentials: this job executes third-party build code in a
      # --privileged container, so it must not carry a writable git token.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.build_ref }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: filegraph-native
          path: src

      - name: Stamp the fork version into src/version.py (option A)
        # The app's displayed/checked version carries the fork revision:
        # '<base>+viallon<N>[.<M>]' (PEP 440 local - _parse_version ignores the
        # suffix, so upstream update checks stay on the base).
        env:
          VER: ${{ needs.meta.outputs.subject }}
        run: |
          set -euo pipefail
          if [ -n "$VER" ]; then
            sed -i "s/^__version__ = .*/__version__ = \"$VER\"/" src/version.py
          else
            echo "no subject (dry run) - keeping the committed version"
          fi
          grep -n "__version__" src/version.py

      - name: Assert the extension is where meson expects it
        run: |
          set -euo pipefail
          # Existence, not the executable bit: actions/download-artifact does not
          # preserve file modes, so the bit is always lost in transit. meson's
          # install_data() sets the installed mode itself (install_mode:
          # 'rwxr-xr-x'), so only the file's presence matters to the build.
          test -f src/amethyst_filegraph.abi3.so
          chmod +x src/amethyst_filegraph.abi3.so
          ls -l src/amethyst_filegraph.abi3.so
          file src/amethyst_filegraph.abi3.so

      - name: Build the Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/io.github.Amethyst.ModManager.yml
          branch: ${{ needs.meta.outputs.ostree }}
          # Include the base/runtime commits so a drift rebuild cannot reuse a
          # cached build made against the previous PySide6/Qt.
          cache-key: flatpak-builder-v3-${{ hashFiles('flatpak/io.github.Amethyst.ModManager.yml', 'flatpak/pypi-dependencies.yaml', 'flatpak/maturin.yaml', 'flatpak/Cargo.lock', 'flatpak/cargo-sources.json') }}-${{ needs.meta.outputs.base_commit }}-${{ needs.meta.outputs.runtime_commit }}

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo
          path: repo/
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish to hub-viallon
    needs: [meta, flatpak]
    if: needs.meta.outputs.rebuild == 'true'
    uses: aviallon/hub-viallon/.github/workflows/publish-flatpak.yml@main
    with:
      app-id: io.github.Amethyst.ModManager
      ostree-branch: ${{ needs.meta.outputs.ostree }}
      artifact: flatpak-repo
      pages-dir: amethyst
      # Explicit: inside a called workflow the `github` context refers to THIS
      # (caller) repository, so the hub cannot be derived from github.repository.
      hub-repo: aviallon/hub-viallon
      subject: ${{ needs.meta.outputs.subject }}
      title: Amethyst Mod Manager (viallon build)
      homepage: https://github.com/aviallon/Amethyst-Mod-Manager
      dry-run: ${{ needs.meta.outputs.dry == 'true' }}
    secrets:
      # The run belongs to THIS repository, so GITHUB_TOKEN cannot write to
      # hub-viallon. An SSH deploy key (write access on hub-viallon only) is
      # stored here as HUB_VIALLON_DEPLOY_KEY.
      hub-deploy-key: ${{ secrets.HUB_VIALLON_DEPLOY_KEY }}

  finalize:
    name: Record runtime pins / tag the rebuild
    needs: [meta, publish]
    if: needs.meta.outputs.rebuild == 'true' && needs.meta.outputs.dry != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the pins commit and the automatic tag
    steps:
      - uses: actions/checkout@v4
        with:
          # A tag-triggered or drift run would otherwise be on a detached HEAD,
          # where the pins commit cannot be pushed.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          # Push with a PAT when available: GITHUB_TOKEN is refused any ref whose
          # commit touches a workflow file ("without `workflows` permission"),
          # which is exactly what the release commits do. Falls back to
          # GITHUB_TOKEN (the pins push still works, the tag push then warns).
          token: ${{ secrets.AMETHYST_PUSH_TOKEN || github.token }}

      # The auto tag matches the `v*-viallon*` push trigger; the tag-push path
      # ignores `N.M` tags precisely so this cannot double-build. It runs BEFORE
      # the pins on purpose: if the tag push fails, the pins stay un-advanced so
      # the next schedule re-fires the drift and retries the tag. Best effort:
      # the failure is a warning, not a red run after a successful publish.
      - name: Tag the automatic rebuild (viallonN.M), if any
        id: tag
        if: needs.meta.outputs.tag != ''
        continue-on-error: true
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          SHA: ${{ needs.meta.outputs.build_sha }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists; nothing to do"
            exit 0
          fi
          git tag "$TAG" "$SHA"
          if git push origin "$TAG"; then
            echo "pushed $TAG" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::could not push tag $TAG — check that AMETHYST_PUSH_TOKEN has Contents: write and Workflows: write"
            exit 1
          fi

      # Only after a *successful* publish, and only if the tag above did not
      # fail: a failed build or tag must not advance the pins, or the next
      # schedule would consider the drift already handled. An invalid or
      # under-scoped PAT makes this push fail on purpose: the pins must land,
      # otherwise every schedule would re-fire the drift rebuild.
      - name: Record the base/runtime commits used
        if: steps.tag.outcome != 'failure'
        env:
          BASE: ${{ needs.meta.outputs.base_commit }}
          RUNTIME: ${{ needs.meta.outputs.runtime_commit }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [ -z "$RUNTIME" ]; then
            echo "::warning::base/runtime commits unknown; leaving the pins unchanged"
            exit 0
          fi
          mkdir -p .github
          jq -n --arg base "$BASE" --arg runtime "$RUNTIME" \
            '{base: $base, runtime: $runtime}' > .github/flatpak-runtime-pins.json
          cat .github/flatpak-runtime-pins.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/flatpak-runtime-pins.json
          git diff --cached --quiet || git commit -m "chore(flatpak): pin runtime commits used by the last build"
          git push

      # One GitHub release per pushed tag, created only AFTER the Flatpak was
      # built and published, so a release page always means "there is a build".
      # A letter-suffixed tag (viallon0a) is a PRERELEASE: it is published on the
      # beta Flatpak branch and must never look like a stable release.
      # Only a real TAG PUSH creates a release. `tag == ''` alone is NOT enough:
      # it is also true for a manual dispatch, whose ref is a BRANCH name, and
      # `gh release create` would then mint a bogus tag named after the branch.
      # The drift rebuild's own automatic tag (tag != '') must not create a
      # second release either.
      - name: Create the GitHub release
        if: |
          needs.meta.outputs.tag == ''
          && github.event_name == 'push'
          && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SUBJECT: ${{ needs.meta.outputs.subject }}
          OSTREE: ${{ needs.meta.outputs.ostree }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; nothing to do"
            exit 0
          fi
          args=(--title "Amethyst Mod Manager ${SUBJECT}")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
            kind="prerelease"
          else
            kind="release"
          fi
          {
            echo "Fork build of ${SUBJECT%%+*} — published on the **${OSTREE}** Flatpak branch."
            echo
            echo '```bash'
            echo "# first time only (the remote is unsigned: --no-gpg-verify if asked)"
            echo "flatpak remote-add --user --if-not-exists amethyst-aviallon \\"
            echo "  https://aviallon.github.io/hub-viallon/amethyst/amethyst.flatpakrepo"
            echo "flatpak install --user amethyst-aviallon io.github.Amethyst.ModManager//${OSTREE}"
            echo "# afterwards"
            echo "flatpak update --user io.github.Amethyst.ModManager"
            echo '```'
          } > /tmp/release-notes.md
          # Notes above are prepended to the notes GitHub generates from the
          # commits since the previous release (gh documents exactly that).
          gh release create "$TAG" --notes-file /tmp/release-notes.md \
            --generate-notes "${args[@]}"
          echo "created the $kind $TAG" | tee -a "$GITHUB_STEP_SUMMARY"
